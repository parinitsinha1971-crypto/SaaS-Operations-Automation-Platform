[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = [
  "B008",   # FastAPI's Depends()/Body() in defaults is idiomatic
  "S101",   # asserts are fine in tests
  "S104",   # services bind 0.0.0.0 inside containers by design
  "S311",   # random is used for simulation, not crypto
  "S608",   # the only f-string SQL is a statement_timeout integer
  "ASYNC109",
]

[tool.ruff.lint.isort]
known-first-party = ["ops", "sim"]

[tool.ruff.lint.per-file-ignores]
"ops-platform/tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["ops-platform/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

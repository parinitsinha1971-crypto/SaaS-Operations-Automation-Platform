apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  # Incident history and restarts straight from the platform's database (read-only role)
  - name: Ops DB
    uid: ops-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: ops-db:5432
    user: grafana_ro
    jsonData:
      database: ops
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
